services:
  - type: web
    name: msg-notify
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SEND_KEY
        generateValue: true
      - key: VIEW_KEY
        generateValue: true
      # Generate once with `npx web-push generate-vapid-keys` and paste both in. Never change them: phones would stop getting pushes.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
