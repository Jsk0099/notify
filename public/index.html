<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f5f7; color: #111; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    #status { color: #666; font-size: .9rem; }
    button { font-size: 1rem; padding: 10px 14px; border-radius: 8px; border: 0; background: #2563eb; color: #fff; }
    ul { list-style: none; padding: 0; }
    li { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 8px; box-shadow: 0 1px 2px #0002; word-wrap: break-word; }
    li small { display: block; color: #888; margin-top: 4px; }
    #toast { position: fixed; left: 16px; right: 16px; top: 16px; background: #111; color: #fff; padding: 14px; border-radius: 10px;
             opacity: 0; transform: translateY(-20px); transition: .3s; pointer-events: none; }
    #toast.show { opacity: 1; transform: none; }
  </style>
</head>
<body>
  <h1>Messages</h1>
  <p id="status">Connecting…</p>
  <button id="notify" hidden>Enable notifications</button>
  <button id="clear" hidden>Clear</button>
  <ul id="list"></ul>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    // The installed app opens at "/" without ?key=, so remember the key from the first visit.
    let key = new URLSearchParams(location.search).get('key') || '';
    try { key ? localStorage.setItem('key', key) : (key = localStorage.getItem('key') || ''); } catch {}
    navigator.serviceWorker?.register('/sw.js');

    // Web Push: lets the server wake the phone when this app and the browser are closed.
    async function subscribe() {
      try {
        const reg = await navigator.serviceWorker.ready;
        const r = await fetch('/api/vapid');
        if (!r.ok || !reg.pushManager) return; // push not configured on the server, or iOS app not added to Home Screen
        const vapid = (await r.json()).key.replace(/-/g, '+').replace(/_/g, '/');
        const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({
          userVisibleOnly: true, applicationServerKey: Uint8Array.from(atob(vapid), (c) => c.charCodeAt(0)),
        });
        await fetch('/api/subscribe?key=' + encodeURIComponent(key), { method: 'POST', body: JSON.stringify(sub) });
      } catch (err) { console.error('push subscribe failed', err); }
    }

    // Mobile browsers only allow the permission prompt from a tap.
    if (window.Notification?.permission === 'default') $('notify').hidden = false;
    if (window.Notification?.permission === 'granted') subscribe(); // re-send on every open: server may have restarted
    $('notify').onclick = async () => {
      if (await Notification.requestPermission() === 'granted') subscribe();
      $('notify').hidden = true;
    };

    // Clear is per browser: the server still keeps history, so remember the newest cleared id and skip up to it.
    let cleared = 0, newest = 0;
    try { cleared = Number(localStorage.getItem('cleared')) || 0; } catch {}
    $('clear').onclick = () => {
      cleared = newest;
      try { localStorage.setItem('cleared', cleared); } catch {}
      $('list').replaceChildren();
      $('clear').hidden = true;
    };

    let live = false, toastTimer;
    const es = new EventSource('/api/stream?key=' + encodeURIComponent(key));
    es.onopen = () => ($('status').textContent = 'Connected');
    es.onerror = () => ($('status').textContent =
      es.readyState === EventSource.CLOSED ? 'Disconnected (check ?key= in the URL)' : 'Reconnecting…');
    es.addEventListener('ready', () => (live = true));

    es.onmessage = async (e) => {
      const { id, msg } = JSON.parse(e.data);
      if (id <= cleared) return;
      newest = Math.max(newest, id);
      $('clear').hidden = false;
      const li = document.createElement('li');
      li.textContent = msg; // textContent: a message is never rendered as HTML
      const time = document.createElement('small');
      time.textContent = new Date(id).toLocaleString();
      li.append(time);
      $('list').prepend(li);
      if (!live) return; // history loaded on page open: show it, don't notify

      $('toast').textContent = msg;
      $('toast').classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000);
      navigator.vibrate?.(200);
      if (window.Notification?.permission === 'granted') {
        (await navigator.serviceWorker.ready).showNotification('New message', { body: msg, tag: String(id) });
      }
    };
  </script>
</body>
</html>
